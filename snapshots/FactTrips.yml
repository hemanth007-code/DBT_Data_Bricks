snapshots:
  - name: facttrips
    relation: ref('trips') # source('my_source', 'my_table') or ref('my_model')
    description:  markdown_string
    config:
      database: dbtsparkproject
      schema: gold
      strategy: timestamp 
      unique_key: trip_id
      updated_at: last_updated_timestamp
      dbt_valid_to_current: "to_date('9999-12-31')"   